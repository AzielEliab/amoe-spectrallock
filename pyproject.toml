[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amoe-spectrallock"
version = "1.2.0"
description = "AMOE-1.2 wiring on the SpectralLock 0.3.1 color grid. Not a field and not a color. Author Aziel Eliab."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Aziel Eliab"}]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
amoe = "amoe.cli:main"

[tool.setuptools]
packages = ["amoe", "spectrallock", "spectrallock.recover"]

[tool.setuptools.package-dir]
amoe = "amoe"
spectrallock = "vendor/spectrallock"
"spectrallock.recover" = "vendor/spectrallock/recover"

[tool.setuptools.package-data]
spectrallock = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
