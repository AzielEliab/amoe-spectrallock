name = "amoe-spectrallock-download-tracker"
main = "src/index.js"
compatibility_date = "2026-09-10"
workers_dev = true
account_id = "ac575a9b822bea2bed97d0ab73aed238"

# Isolated counter. Do not reuse another product's DOWNLOADS namespace.
# Before the first deploy:
#   npx wrangler kv namespace create AMOE_SPECTRALLOCK_DOWNLOADS
# Paste that namespace id here. The placeholder makes deploy fail closed.
[[kv_namespaces]]
binding = "DOWNLOADS"
id = "REPLACE_WITH_AMOE_SPECTRALLOCK_DOWNLOADS_ID"

[assets]
directory = "./public"
binding = "ASSETS"
# Every request hits the Worker so the tarball cannot be fetched uncounted.
run_worker_first = true

[observability]
enabled = true
head_sampling_rate = 1
